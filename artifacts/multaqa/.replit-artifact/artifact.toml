kind = "web"
previewPath = "/"
title = "Multaqa"
version = "1.0.0"
id = "artifacts/multaqa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24100

[services.development]
run = "pnpm --filter @workspace/multaqa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/multaqa", "run", "build" ]
publicDir = "artifacts/multaqa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24100"
BASE_PATH = "/"
